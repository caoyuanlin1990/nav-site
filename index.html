<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#165DFF" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="简洁高效的个人导航系统">
<title>常用导航</title>
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;常用导航&quot;,&quot;short_name&quot;:&quot;导航&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#f4f6fa&quot;,&quot;theme_color&quot;:&quot;#165DFF&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>&quot;,&quot;sizes&quot;:&quot;any&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --primary: #165DFF; --primary-hover: #0E4FD9; --primary-light: rgba(22,93,255,.12);
  --bg: #f4f6fa; --card: #fff; --text: #1d2129; --text-secondary: #86909c;
  --border: #e5e6eb; --shadow: 0 4px 16px rgba(0,0,0,.06); --radius: 14px;
  --success: #00b42a; --danger: #f53f3f; --pin: #f7ba1e;
  --card-min: 140px; --card-pad: 15px 8px 13px; --icon-size: 42px;
}
[data-theme="dark"] {
  --bg: #0d0f14; --card: #181b24; --text: #e8e9ed; --text-secondary: #8b919a;
  --border: #2a2e3a; --shadow: 0 4px 24px rgba(0,0,0,.45); --primary-light: rgba(22,93,255,.2);
}
[data-density="compact"] { --card-min: 108px; --card-pad: 10px 6px 9px; --icon-size: 32px; }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  transition: background .3s, color .3s; -webkit-tap-highlight-color: transparent;
  padding-bottom: env(safe-area-inset-bottom);
}
#front { max-width:1160px; margin:0 auto; padding:16px 12px 88px; }
.header { text-align:center; margin-bottom:16px; position:relative; }
.header h1 { font-size:21px; font-weight:700; color:var(--primary); display:flex; align-items:center; justify-content:center; gap:8px; }
.header .desc { color:var(--text-secondary); font-size:11.5px; margin-top:2px; }
.header-actions { position:absolute; right:0; top:0; display:flex; gap:4px; }
.icon-circle {
  width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
  background:var(--card); color:var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:12.5px; transition:.2s;
}
.icon-circle:hover, .icon-circle.active { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.search-box { max-width:460px; margin:0 auto 14px; position:relative; }
.search-box > i { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text-secondary); font-size:12.5px; pointer-events:none; }
.search-input {
  width:100%; padding:10px 36px; border-radius:50px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:13.5px; outline:none; box-shadow:var(--shadow); transition:.2s;
}
.search-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
.search-clear {
  position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none;
  color:var(--text-secondary); cursor:pointer; display:none; font-size:12px; padding:3px;
}
.search-input:not(:placeholder-shown) ~ .search-clear { display:block; }
.toolbar { display:flex; align-items:center; justify-content:space-between; gap:7px; margin-bottom:11px; flex-wrap:wrap; }
.category-bar { display:flex; flex-wrap:wrap; gap:4px; flex:1; }
.category-btn {
  padding:4px 10px; border-radius:15px; background:var(--card); border:1px solid var(--border);
  color:var(--text); cursor:pointer; font-size:11.5px; transition:.2s; white-space:nowrap;
  display:inline-flex; align-items:center; gap:3px;
}
.category-btn .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.category-btn.active, .category-btn:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
.category-btn.active .dot { background:#fff !important; }
.filter-row { display:flex; gap:6px; align-items:center; }
.sort-select, .filter-btn {
  padding:4px 7px; border-radius:7px; border:1px solid var(--border); background:var(--card);
  color:var(--text); font-size:11.5px; outline:none; cursor:pointer; transition:.2s;
}
.filter-btn.active { border-color:var(--pin); color:var(--pin); background:rgba(247,186,30,.1); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--card-min),1fr)); gap:9px; }
.card {
  background:var(--card); border-radius:var(--radius); padding:var(--card-pad); text-align:center;
  cursor:pointer; box-shadow:var(--shadow); border:1px solid transparent;
  transition:all .2s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden;
}
.card:hover { transform:translateY(-3px); box-shadow:0 9px 20px rgba(0,0,0,.1); border-color:var(--primary); }
.card.pinned { border-color:var(--pin); background:linear-gradient(145deg,var(--card) 75%,rgba(247,186,30,.07)); }
.card .pin-badge { position:absolute; top:4px; left:4px; color:var(--pin); font-size:9px; }
.card .icon-wrap {
  width:var(--icon-size); height:var(--icon-size); margin:0 auto 5px; border-radius:9px;
  background:var(--bg); display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.card .icon-wrap img { width:55%; height:55%; object-fit:contain; }
.card .icon-wrap .fallback { font-size:calc(var(--icon-size)*.4); color:var(--primary); font-weight:600; }
.card .name { font-weight:600; font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .cat { font-size:9.5px; color:var(--text-secondary); margin-top:2px; display:flex; align-items:center; justify-content:center; gap:3px; }
.card .cat .dot { width:5px; height:5px; border-radius:50%; }
.card .count {
  position:absolute; top:4px; right:4px; font-size:9px; color:var(--text-secondary);
  background:var(--bg); padding:1px 4px; border-radius:6px; opacity:0; transition:.2s;
}
.card:hover .count { opacity:1; }
.empty-state { text-align:center; padding:44px 14px; color:var(--text-secondary); grid-column:1/-1; }
.empty-state i { font-size:34px; margin-bottom:7px; opacity:.4; display:block; }
.admin-entry {
  position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); right:16px; padding:9px 14px; border-radius:50px;
  background:var(--primary); color:#fff; font-size:12px; font-weight:500; cursor:pointer;
  box-shadow:0 5px 15px rgba(22,93,255,.35); display:flex; align-items:center; gap:5px;
  z-index:50; transition:.2s; border:none;
}
.admin-entry:hover { filter:brightness(.92); transform:translateY(-2px); }
#login,#admin,#stats { max-width:740px; margin:0 auto; padding:24px 12px 48px; display:none; }
.panel { background:var(--card); border-radius:14px; padding:16px 14px; box-shadow:var(--shadow); border:1px solid var(--border); }
.panel h3 { font-size:14.5px; display:flex; align-items:center; gap:6px; }
.form-group { margin-bottom:7px; }
input,textarea,select {
  width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:12.5px; outline:none; transition:.2s;
}
input:focus,textarea:focus,select:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
textarea { min-height:64px; resize:vertical; font-family:inherit; }
.btn {
  padding:8px 11px; border:none; border-radius:8px; background:var(--primary); color:#fff;
  font-size:12px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center;
  justify-content:center; gap:4px; transition:.2s; width:100%; margin-top:3px;
}
.btn:hover { filter:brightness(.92); }
.btn-secondary { background:var(--bg); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover { background:var(--border); }
.btn-success { background:var(--success); }
.btn-danger { background:var(--danger); }
.btn-sm { width:auto; padding:3px 8px; font-size:11px; margin:0; }
.btn-row { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
.btn-row .btn { flex:1; min-width:70px; }
.head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:5px; }
.stats-bar { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; font-size:11px; color:var(--text-secondary); }
.stats-bar span { background:var(--bg); padding:2px 7px; border-radius:5px; }
.admin-card {
  background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:8px 9px;
  margin-bottom:5px; display:flex; align-items:center; gap:7px; transition:.15s;
}
.admin-card:hover { border-color:var(--primary); }
.admin-card.selected { border-color:var(--primary); background:var(--primary-light); }
.admin-card .drag-handle { cursor:grab; color:var(--text-secondary); padding:1px; font-size:11px; }
.admin-card .check { width:13px; height:13px; accent-color:var(--primary); cursor:pointer; flex-shrink:0; }
.admin-card .info { flex:1; min-width:0; cursor:pointer; }
.admin-card .info .title {
  font-weight:600; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  display:flex; align-items:center; gap:3px;
}
.admin-card .info .title .pin-icon { color:var(--pin); font-size:9px; }
.admin-card .info .meta { font-size:10px; color:var(--text-secondary); margin-top:1px; }
.admin-card .actions { display:flex; gap:2px; flex-shrink:0; }
.icon-btn {
  width:25px; height:25px; border-radius:6px; border:1px solid var(--border); background:var(--card);
  color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:10.5px; transition:.15s;
}
.icon-btn:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.icon-btn.danger:hover { border-color:var(--danger); color:var(--danger); background:rgba(245,63,63,.08); }
.icon-btn.pin:hover, .icon-btn.pinned { border-color:var(--pin); color:var(--pin); background:rgba(247,186,30,.1); }
.modal-mask {
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:none;
  align-items:center; justify-content:center; padding:12px; backdrop-filter:blur(5px);
}
.modal-mask.show { display:flex; }
.modal {
  background:var(--card); border-radius:13px; width:100%; max-width:370px; padding:16px 14px;
  box-shadow:0 14px 40px rgba(0,0,0,.28); border:1px solid var(--border);
  animation:modalIn .2s ease; max-height:90vh; overflow-y:auto;
}
@keyframes modalIn { from{opacity:0;transform:translateY(8px) scale(.97)} to{opacity:1;transform:none} }
.modal h4 { font-size:14px; margin-bottom:11px; display:flex; align-items:center; gap:6px; }
.modal .form-group { margin-bottom:9px; }
.modal .form-group label { display:block; font-size:10.5px; color:var(--text-secondary); margin-bottom:2px; }
.modal-actions { display:flex; gap:5px; margin-top:11px; }
.modal-actions .btn { margin:0; }
.color-picker { display:flex; gap:5px; flex-wrap:wrap; margin-top:3px; }
.color-dot { width:20px; height:20px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:.15s; }
.color-dot:hover, .color-dot.selected { border-color:var(--text); transform:scale(1.12); }
.toast {
  position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-10px);
  background:var(--text); color:var(--card); padding:7px 14px; border-radius:8px; font-size:12px;
  opacity:0; pointer-events:none; transition:.25s; z-index:999; box-shadow:0 6px 18px rgba(0,0,0,.22);
  max-width:88vw; text-align:center;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.batch-toolbar {
  display:none; align-items:center; gap:5px; margin-bottom:6px; padding:5px 9px;
  background:var(--primary-light); border-radius:7px; font-size:11.5px; flex-wrap:wrap;
}
.batch-toolbar.show { display:flex; }
.rank-item {
  display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--bg);
  border-radius:8px; margin-bottom:5px; border:1px solid var(--border);
}
.rank-num {
  width:20px; height:20px; border-radius:50%; background:var(--primary); color:#fff;
  font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.rank-num.gold{background:#f7ba1e} .rank-num.silver{background:#a0a4ad} .rank-num.bronze{background:#cd7f32}
.rank-info { flex:1; min-width:0; }
.rank-info .name { font-weight:600; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank-info .meta { font-size:10px; color:var(--text-secondary); }
.rank-count { font-weight:700; font-size:12.5px; color:var(--primary); flex-shrink:0; }
.tabs { display:flex; gap:2px; margin-bottom:10px; background:var(--bg); padding:2px; border-radius:8px; }
.tab-btn {
  flex:1; padding:5px; border:none; border-radius:6px; background:transparent;
  color:var(--text-secondary); font-size:12px; cursor:pointer; transition:.2s;
}
.tab-btn.active { background:var(--card); color:var(--primary); font-weight:600; box-shadow:var(--shadow); }
.undo-bar {
  position:fixed; bottom:calc(64px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--card); padding:7px 12px; border-radius:9px; font-size:12px; display:none;
  align-items:center; gap:9px; z-index:100; box-shadow:0 5px 18px rgba(0,0,0,.25);
}
.undo-bar.show { display:flex; }
.undo-bar button { background:var(--primary); color:#fff; border:none; padding:2px 9px; border-radius:5px; cursor:pointer; font-size:11.5px; }
.shortcut-hint {
  position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:16px; font-size:10.5px; color:var(--text-secondary);
  background:var(--card); border:1px solid var(--border); padding:4px 8px; border-radius:6px;
  opacity:.7; z-index:40; display:none;
}
.install-banner {
  display:none; position:fixed; bottom:calc(70px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--primary); color:#fff; padding:8px 14px; border-radius:10px; font-size:12px;
  z-index:60; box-shadow:0 6px 20px rgba(22,93,255,.4); align-items:center; gap:10px; white-space:nowrap;
}
.install-banner.show { display:flex; }
.install-banner button {
  background:#fff; color:var(--primary); border:none; padding:3px 10px; border-radius:6px;
  cursor:pointer; font-size:11.5px; font-weight:600;
}
.sync-dot {
  display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--success); margin-left:4px;
}
.sync-dot.pending { background:var(--pin); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.ver { font-size:10px; color:var(--text-secondary); opacity:.6; margin-top:12px; text-align:center; }
@media (min-width:700px) { .shortcut-hint { display:block; } }
@media (max-width:600px) {
  .grid { gap:7px; }
  .admin-entry { bottom:calc(10px + env(safe-area-inset-bottom)); right:10px; padding:8px 11px; font-size:11.5px; }
  .panel { padding:13px 11px; }
  .toolbar { flex-direction:column; align-items:stretch; }
  .filter-row { width:100%; }
  .sort-select { flex:1; }
}
</style>
</head>
<body>
<div id="front">
  <div class="header">
    <h1><i class="fa-solid fa-compass"></i> 常用导航</h1>
    <p class="desc">简洁 · 高效 · 安全</p>
    <div class="header-actions">
      <button class="icon-circle" id="densityBtn" onclick="toggleDensity()" title="紧凑模式 (D)"><i class="fa-solid fa-table-cells"></i></button>
      <button class="icon-circle" onclick="showStats()" title="访问统计 (S)"><i class="fa-solid fa-chart-simple"></i></button>
      <button class="icon-circle" onclick="toggleTheme()" title="切换主题 (T)"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
    </div>
  </div>
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input class="search-input" id="f_search" placeholder="搜索网站 / 分类 / 链接 / 备注... ( / )" oninput="renderFront()">
    <button class="search-clear" onclick="clearSearch()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="toolbar">
    <div class="category-bar" id="categoryWrap"></div>
    <div class="filter-row">
      <button class="filter-btn" id="pinFilterBtn" onclick="togglePinFilter()" title="仅看置顶 (P)"><i class="fa-solid fa-thumbtack"></i> 置顶</button>
      <select class="sort-select" id="sortSelect" onchange="renderFront()">
        <option value="default">默认排序</option>
        <option value="visits">访问最多</option>
        <option value="name">名称 A-Z</option>
        <option value="recent">最近添加</option>
      </select>
    </div>
  </div>
  <div class="grid" id="f_list"></div>
  <button class="admin-entry" onclick="showAdmin()"><i class="fa-solid fa-user-shield"></i> 后台管理</button>
</div>

<div id="login">
  <div class="panel">
    <h3><i class="fa-solid fa-lock"></i> 管理员登录</h3>
    <div class="form-group" style="margin-top:11px">
      <input id="pwd" type="password" placeholder="输入管理密码" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> 登录</button>
    <button class="btn btn-secondary" onclick="showFront()"><i class="fa-solid fa-house"></i> 返回前台</button>
  </div>
</div>

<div id="stats">
  <div class="panel">
    <div class="head">
      <h3 style="margin:0"><i class="fa-solid fa-chart-simple"></i> 访问统计</h3>
      <button class="btn btn-sm btn-secondary" onclick="showFront()"><i class="fa-solid fa-house"></i> 前台</button>
    </div>
    <div class="stats-bar" id="statsOverview"></div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchRankTab('visits',this)">访问排行</button>
      <button class="tab-btn" onclick="switchRankTab('category',this)">分类统计</button>
      <button class="tab-btn" onclick="switchRankTab('recent',this)">最近访问</button>
    </div>
    <div id="rankList"></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-secondary btn-sm" style="width:auto" onclick="resetAllCounts()"><i class="fa-solid fa-rotate-left"></i> 清空访问计数</button>
    </div>
  </div>
</div>

<div id="admin">
  <div class="panel">
    <div class="head">
      <h3 style="margin:0"><i class="fa-solid fa-gears"></i> 管理后台 <span class="sync-dot" id="syncDot" title="数据状态"></span></h3>
      <div style="display:flex;gap:4px">
        <button class="btn btn-sm btn-secondary" onclick="openThemeModal()" title="主题色"><i class="fa-solid fa-droplet"></i></button>
        <button class="btn btn-sm btn-secondary" onclick="openPwdModal()" title="修改密码"><i class="fa-solid fa-key"></i></button>
        <button class="btn btn-sm btn-secondary" onclick="showStats()"><i class="fa-solid fa-chart-simple"></i></button>
        <button class="btn btn-sm btn-secondary" onclick="showFront()"><i class="fa-solid fa-house"></i></button>
      </div>
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="form-group"><input id="search" placeholder="搜索名称 / 分类 / 链接 / 备注" oninput="render()"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px">
      <div class="form-group"><input id="category" placeholder="分类" list="catList"></div>
      <div class="form-group"><input id="name" placeholder="名称"></div>
    </div>
    <datalist id="catList"></datalist>
    <div class="form-group"><input id="url" placeholder="链接 https://..." onblur="autoHttps(this)"></div>
    <div class="form-group"><input id="note" placeholder="备注（可选）"></div>
    <div class="btn-row">
      <button class="btn" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> 添加</button>
      <button class="btn btn-secondary" onclick="toggleBatchArea()"><i class="fa-solid fa-layer-group"></i> 批量</button>
      <button class="btn btn-secondary" onclick="openCatColorModal()"><i class="fa-solid fa-palette"></i> 颜色</button>
    </div>
    <div id="batchArea" style="display:none;margin-top:7px">
      <textarea id="batch" placeholder="每行：名称|链接  或  名称|链接|分类  或  名称|链接|分类|备注"></textarea>
      <button class="btn" onclick="batchAdd()"><i class="fa-solid fa-layer-group"></i> 批量添加</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-success" onclick="saveToKV()"><i class="fa-solid fa-cloud-arrow-up"></i> 同步云端</button>
      <button class="btn btn-secondary" onclick="exportJSON()"><i class="fa-solid fa-download"></i> 导出</button>
      <button class="btn btn-secondary" onclick="importJSON()"><i class="fa-solid fa-upload"></i> 导入</button>
    </div>
    <div class="batch-toolbar" id="batchToolbar">
      <span id="selectedCount">已选 0 项</span>
      <button class="btn btn-sm btn-secondary" onclick="batchPin(true)"><i class="fa-solid fa-thumbtack"></i> 置顶</button>
      <button class="btn btn-sm btn-secondary" onclick="batchPin(false)"><i class="fa-solid fa-thumbtack" style="opacity:.4"></i> 取消</button>
      <button class="btn btn-sm btn-secondary" onclick="batchChangeCat()"><i class="fa-solid fa-folder"></i> 改分类</button>
      <button class="btn btn-sm btn-danger" onclick="batchDelete()"><i class="fa-solid fa-trash"></i> 删除</button>
      <button class="btn btn-sm btn-secondary" onclick="clearSelection()">取消选择</button>
    </div>
    <div style="margin-top:11px" id="list"></div>
    <p class="ver">导航系统 v3.0</p>
  </div>
</div>

<div class="modal-mask" id="editModal">
  <div class="modal">
    <h4 id="modalTitle"><i class="fa-solid fa-pen"></i> 编辑网站</h4>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveModal()"><i class="fa-solid fa-check"></i> 保存</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="catColorModal">
  <div class="modal">
    <h4><i class="fa-solid fa-palette"></i> 分类颜色</h4>
    <div id="catColorList"></div>
    <div class="modal-actions" style="margin-top:12px"><button class="btn btn-secondary" onclick="closeCatColorModal()">关闭</button></div>
  </div>
</div>
<div class="modal-mask" id="themeModal">
  <div class="modal">
    <h4><i class="fa-solid fa-droplet"></i> 主题色</h4>
    <div class="color-picker" id="themeColorPicker" style="margin:10px 0"></div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeThemeModal()">关闭</button></div>
  </div>
</div>
<div class="modal-mask" id="pwdModal">
  <div class="modal">
    <h4><i class="fa-solid fa-key"></i> 修改管理密码</h4>
    <p style="font-size:11.5px;color:var(--text-secondary);margin-bottom:9px">密码保存在本地浏览器</p>
    <div class="form-group"><label>当前密码</label><input id="pwd_old" type="password"></div>
    <div class="form-group"><label>新密码</label><input id="pwd_new" type="password"></div>
    <div class="form-group"><label>确认新密码</label><input id="pwd_confirm" type="password"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closePwdModal()">取消</button>
      <button class="btn" onclick="changePwd()"><i class="fa-solid fa-check"></i> 修改</button>
    </div>
  </div>

<div class="toast" id="toast"></div>
<div class="undo-bar" id="undoBar"><span id="undoText">已删除</span><button onclick="undoDelete()">撤销</button></div>

  <span>安装到桌面，体验更好</span>
  <button onclick="installPWA()">安装</button>

</div>

<script>
const KV_API="https://jj.xiaohe1999.dpdns.org",DEFAULT_ADMIN_PWD="778899",SAVE_PWD="668899";
const CAT_COLORS=["#165DFF","#00b42a","#f53f3f","#ff7d00","#722ed1","#0fc6c2","#f7ba1e","#eb2f96","#3491fa","#86909c"];
const THEME_COLORS=["#165DFF","#00b42a","#f53f3f","#ff7d00","#722ed1","#0fc6c2","#eb2f96","#3491fa","#1d2129","#86909c"];
let data={lines:[],catColors:{},recent:[]},currentCat="全部",pinOnly=false,dragSrcIdx=null,editIdx=null;
let selected=new Set(),rankTab="visits",lastDeleted=null,undoTimer=null,dirty=false;
let adminPwd=localStorage.getItem("nav_admin_pwd")||DEFAULT_ADMIN_PWD,deferredPrompt=null;

function toast(msg,d=2200){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),d);}
function escapeHtml(s){if(s==null)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function getFavicon(url){try{const u=new URL(url.startsWith("http")?url:"https://"+url);return`https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64`;}catch{return null;}}
function getDomain(url){try{return new URL(url.startsWith("http")?url:"https://"+url).hostname;}catch{return"";}}
function autoHttps(el){let v=el.value.trim();if(v&&!/^https?:\/\//i.test(v))el.value="https://"+v;}
function normalizeItem(i){i.count=i.count??0;i.category=i.category||"未分类";i.pinned=!!i.pinned;i.created=i.created||Date.now();i.note=i.note||"";return i;}
function getCatColor(cat){if(!data.catColors)data.catColors={};if(data.catColors[cat])return data.catColors[cat];const idx=Object.keys(data.catColors).length%CAT_COLORS.length;data.catColors[cat]=CAT_COLORS[idx];return data.catColors[cat];}
function markDirty(){dirty=true;const d=document.getElementById("syncDot");if(d){d.classList.add("pending");d.title="有未同步更改";}localStorage.setItem("nav_data_backup",JSON.stringify(data));}
function markClean(){dirty=false;const d=document.getElementById("syncDot");if(d){d.classList.remove("pending");d.title="已同步";}}
function applyPrimary(c){document.documentElement.style.setProperty("--primary",c);document.documentElement.style.setProperty("--primary-hover",c);document.documentElement.style.setProperty("--primary-light",c+"1f");document.getElementById("metaTheme").setAttribute("content",c);localStorage.setItem("nav_primary",c);}
function initPrimary(){const c=localStorage.getItem("nav_primary");if(c)applyPrimary(c);}

function toggleTheme(){const h=document.documentElement,isDark=h.getAttribute("data-theme")==="dark";h.setAttribute("data-theme",isDark?"light":"dark");document.getElementById("themeIcon").className=isDark?"fa-solid fa-moon":"fa-solid fa-sun";localStorage.setItem("nav_theme",isDark?"light":"dark");}
function initTheme(){const s=localStorage.getItem("nav_theme");if(s==="dark"||(!s&&matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.setAttribute("data-theme","dark");document.getElementById("themeIcon").className="fa-solid fa-sun";}}
function toggleDensity(){const h=document.documentElement,isC=h.getAttribute("data-density")==="compact";h.setAttribute("data-density",isC?"normal":"compact");document.getElementById("densityBtn").classList.toggle("active",!isC);localStorage.setItem("nav_density",isC?"normal":"compact");}
function initDensity(){if(localStorage.getItem("nav_density")==="compact"){document.documentElement.setAttribute("data-density","compact");document.getElementById("densityBtn").classList.add("active");}}
function togglePinFilter(){pinOnly=!pinOnly;document.getElementById("pinFilterBtn").classList.toggle("active",pinOnly);renderFront();}

function hideAll(){["front","login","admin","stats"].forEach(id=>document.getElementById(id).style.display="none");}
function showFront(){hideAll();document.getElementById("front").style.display="block";selected.clear();renderFront();}
function showAdmin(){hideAll();document.getElementById("login").style.display="block";document.getElementById("pwd").value="";setTimeout(()=>document.getElementById("pwd").focus(),40);}
function showStats(){hideAll();document.getElementById("stats").style.display="block";renderStats();}
function login(){if(document.getElementById("pwd").value===adminPwd){hideAll();document.getElementById("admin").style.display="block";loadFromKV();}else toast("密码错误");}

function clearSearch(){document.getElementById("f_search").value="";renderFront();}
function getFrontList(){
  const kw=(document.getElementById("f_search")?.value||"").toLowerCase().trim();
  let list=[...(data.lines||[])];
  if(pinOnly)list=list.filter(i=>i.pinned);
  if(currentCat!=="全部")list=list.filter(i=>(i.category||"未分类")===currentCat);
  if(kw)list=list.filter(item=>(item.name||"").toLowerCase().includes(kw)||(item.category||"").toLowerCase().includes(kw)||(item.url||"").toLowerCase().includes(kw)||(item.note||"").toLowerCase().includes(kw));
  const sort=document.getElementById("sortSelect")?.value||"default";
  if(sort==="visits")list.sort((a,b)=>(b.count||0)-(a.count||0));
  else if(sort==="name")list.sort((a,b)=>(a.name||"").localeCompare(b.name||"","zh"));
  else if(sort==="recent")list.sort((a,b)=>(b.created||0)-(a.created||0));
  else list.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  return list;
}
function renderCategoryBar(){
  const wrap=document.getElementById("categoryWrap");const cats=["全部"],countMap={"全部":0};
  (data.lines||[]).forEach(i=>{const c=i.category||"未分类";if(!cats.includes(c))cats.push(c);countMap[c]=(countMap[c]||0)+1;countMap["全部"]++;});
  wrap.innerHTML=cats.map(cat=>{const active=cat===currentCat?"active":"";const dot=cat==="全部"?"":`<span class="dot" style="background:${getCatColor(cat)}"></span>`;
    return`<button class="category-btn ${active}" onclick="switchCat('${escapeHtml(cat)}')">${dot}${escapeHtml(cat)} <small style="opacity:.5">(${countMap[cat]||0})</small></button>`;}).join("");
}
function switchCat(cat){currentCat=cat;renderFront();}
function renderFront(){
  const el=document.getElementById("f_list");renderCategoryBar();const list=getFrontList();
  if(!list.length){el.innerHTML=`<div class="empty-state"><i class="fa-regular fa-folder-open"></i><p>${pinOnly?"暂无置顶网站":"暂无网站"}</p></div>`;return;}
  el.innerHTML=list.map(item=>{
    const fav=getFavicon(item.url),first=(item.name||"?").charAt(0).toUpperCase();
    const icon=fav?`<img src="${fav}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="fallback" style="display:none">${escapeHtml(first)}</span>`:`<span class="fallback">${escapeHtml(first)}</span>`;
    const pinCls=item.pinned?"pinned":"",pinBadge=item.pinned?`<span class="pin-badge"><i class="fa-solid fa-thumbtack"></i></span>`:"";
    const color=getCatColor(item.category||"未分类"),title=item.note?`${escapeHtml(item.name)} - ${escapeHtml(item.note)}`:escapeHtml(item.name);
    return`<div class="card ${pinCls}" onclick="openLink('${escapeHtml(item.url)}','${escapeHtml(item.name)}')" title="${title}">
      ${pinBadge}<span class="count">${item.count||0}</span><div class="icon-wrap">${icon}</div>
      <div class="name">${escapeHtml(item.name)}</div><div class="cat"><span class="dot" style="background:${color}"></span>${escapeHtml(item.category||"未分类")}</div></div>`;
  }).join("");
}
function openLink(url,name){
  const item=data.lines.find(i=>i.url===url&&i.name===name);
  if(item){item.count=(item.count||0)+1;if(!data.recent)data.recent=[];data.recent=data.recent.filter(r=>!(r.url===url&&r.name===name));data.recent.unshift({name:item.name,url:item.url,category:item.category,time:Date.now()});if(data.recent.length>20)data.recent=data.recent.slice(0,20);markDirty();}
  window.open(url.startsWith("http")?url:"https://"+url,"_blank");
}

function switchRankTab(tab,btn){rankTab=tab;document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderStats();}
function renderStats(){
  const lines=data.lines||[],total=lines.length,totalVisits=lines.reduce((s,i)=>s+(i.count||0),0),pinned=lines.filter(i=>i.pinned).length,cats=new Set(lines.map(i=>i.category||"未分类")).size;
  document.getElementById("statsOverview").innerHTML=`<span><i class="fa-solid fa-link"></i> ${total} 网站</span><span><i class="fa-solid fa-eye"></i> ${totalVisits} 访问</span><span><i class="fa-solid fa-folder"></i> ${cats} 分类</span><span><i class="fa-solid fa-thumbtack"></i> ${pinned} 置顶</span>`;
  const el=document.getElementById("rankList");
  if(rankTab==="visits"){
    const sorted=[...lines].sort((a,b)=>(b.count||0)-(a.count||0)).slice(0,30);
    if(!sorted.length){el.innerHTML=`<div class="empty-state" style="padding:24px"><p>暂无数据</p></div>`;return;}
    el.innerHTML=sorted.map((item,i)=>{const numCls=i===0?"gold":i===1?"silver":i===2?"bronze":"";
      return`<div class="rank-item" onclick="openLink('${escapeHtml(item.url)}','${escapeHtml(item.name)}')" style="cursor:pointer"><div class="rank-num ${numCls}">${i+1}</div><div class="rank-info"><div class="name">${escapeHtml(item.name)}</div><div class="meta">${escapeHtml(item.category||"未分类")} · ${escapeHtml(getDomain(item.url))}</div></div><div class="rank-count">${item.count||0}</div></div>`;}).join("");
  }else if(rankTab==="category"){
    const catMap={};lines.forEach(i=>{const c=i.category||"未分类";if(!catMap[c])catMap[c]={count:0,visits:0};catMap[c].count++;catMap[c].visits+=(i.count||0);});
    const sorted=Object.entries(catMap).sort((a,b)=>b[1].visits-a[1].visits);
    el.innerHTML=sorted.map(([name,info],i)=>{const numCls=i===0?"gold":i===1?"silver":i===2?"bronze":"",color=getCatColor(name);
      return`<div class="rank-item"><div class="rank-num ${numCls}">${i+1}</div><div class="rank-info"><div class="name"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${color};margin-right:4px"></span>${escapeHtml(name)}</div><div class="meta">${info.count} 个网站</div></div><div class="rank-count">${info.visits}</div></div>`;}).join("");
  }else{
    const recent=data.recent||[];
    if(!recent.length){el.innerHTML=`<div class="empty-state" style="padding:24px"><p>暂无最近访问记录</p></div>`;return;}
    el.innerHTML=recent.map((item,i)=>{const timeStr=item.time?new Date(item.time).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
      return`<div class="rank-item" onclick="openLink('${escapeHtml(item.url)}','${escapeHtml(item.name)}')" style="cursor:pointer"><div class="rank-num">${i+1}</div><div class="rank-info"><div class="name">${escapeHtml(item.name)}</div><div class="meta">${escapeHtml(item.category||"未分类")} · ${timeStr}</div></div><div class="rank-count"><i class="fa-solid fa-clock-rotate-left" style="font-size:12px"></i></div></div>`;}).join("");
  }
}
function resetAllCounts(){
  if(!confirm("确定清空所有网站的访问计数？此操作不可撤销。"))return;
  (data.lines||[]).forEach(i=>i.count=0);data.recent=[];markDirty();renderStats();toast("访问计数已清空");
}

function updateCatList(){const cats=[...new Set((data.lines||[]).map(i=>i.category||"未分类"))];document.getElementById("catList").innerHTML=cats.map(c=>`<option value="${escapeHtml(c)}">`).join("");}
function getFilteredList(){const kw=(document.getElementById("search")?.value||"").toLowerCase().trim();if(!kw)return data.lines||[];return(data.lines||[]).filter(item=>(item.name||"").toLowerCase().includes(kw)||(item.category||"").toLowerCase().includes(kw)||(item.url||"").toLowerCase().includes(kw)||(item.note||"").toLowerCase().includes(kw));}
function render(){
  const el=document.getElementById("list"),list=getFilteredList(),total=data.lines?.length||0,totalVisits=(data.lines||[]).reduce((s,i)=>s+(i.count||0),0),pinnedCount=(data.lines||[]).filter(i=>i.pinned).length;
  document.getElementById("statsBar").innerHTML=`<span><i class="fa-solid fa-link"></i> ${total} 网站</span><span><i class="fa-solid fa-eye"></i> ${totalVisits} 访问</span><span><i class="fa-solid fa-thumbtack"></i> ${pinnedCount} 置顶</span>`;
  updateCatList();updateBatchToolbar();
  if(!list.length){el.innerHTML=`<div class="empty-state" style="padding:20px"><p>暂无数据</p></div>`;return;}
  el.innerHTML=list.map(item=>{
    const realIdx=data.lines.indexOf(item),checked=selected.has(realIdx)?"checked":"",selCls=selected.has(realIdx)?"selected":"";
    const pinIcon=item.pinned?`<i class="fa-solid fa-thumbtack pin-icon"></i>`:"",pinBtnCls=item.pinned?"pinned":"";
    const noteStr=item.note?` · ${escapeHtml(item.note)}`:"",color=getCatColor(item.category||"未分类");
    return`<div class="admin-card ${selCls}" draggable="true" ondragstart="dragStart(event,${realIdx})" ondragover="dragOver(event)" ondrop="drop(event,${realIdx})" ondragend="dragEnd(event)">
      <input type="checkbox" class="check" ${checked} onchange="toggleSelect(${realIdx},this.checked)">
      <div class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></div>
      <div class="info" onclick="go(${realIdx})"><div class="title">${pinIcon}${escapeHtml(item.name)}</div>
      <div class="meta"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${color};margin-right:2px"></span>${escapeHtml(item.category||"未分类")} · ${item.count||0}次 · ${escapeHtml(getDomain(item.url))}${noteStr}</div></div>
      <div class="actions">
        <button class="icon-btn" onclick="copyLink(${realIdx})" title="复制链接"><i class="fa-solid fa-copy"></i></button>
        <button class="icon-btn pin ${pinBtnCls}" onclick="togglePin(${realIdx})" title="置顶"><i class="fa-solid fa-thumbtack"></i></button>
        <button class="icon-btn" onclick="openEditModal(${realIdx})" title="编辑"><i class="fa-solid fa-pen"></i></button>
        <button class="icon-btn danger" onclick="del(${realIdx})" title="删除"><i class="fa-solid fa-trash"></i></button>
      </div></div>`;
  }).join("");
}
function toggleSelect(idx,checked){if(checked)selected.add(idx);else selected.delete(idx);updateBatchToolbar();render();}
function clearSelection(){selected.clear();updateBatchToolbar();render();}
function updateBatchToolbar(){const bar=document.getElementById("batchToolbar"),n=selected.size;if(n>0){bar.classList.add("show");document.getElementById("selectedCount").textContent=`已选 ${n} 项`;}else bar.classList.remove("show");}
function batchDelete(){if(!selected.size)return;if(!confirm(`确定删除选中的 ${selected.size} 个网站？`))return;const idxs=[...selected].sort((a,b)=>b-a),deleted=idxs.map(i=>data.lines[i]);idxs.forEach(i=>data.lines.splice(i,1));lastDeleted={items:deleted,idxs};selected.clear();markDirty();render();showUndo(`已删除 ${deleted.length} 项`);}
function batchChangeCat(){if(!selected.size)return;const cat=prompt("输入新分类名称：");if(cat===null)return;const newCat=cat.trim()||"未分类",n=selected.size;selected.forEach(idx=>{if(data.lines[idx])data.lines[idx].category=newCat;});selected.clear();markDirty();render();toast(`已将 ${n} 项改为「${newCat}」`);}
function batchPin(val){if(!selected.size)return;const n=selected.size;selected.forEach(idx=>{if(data.lines[idx])data.lines[idx].pinned=val;});selected.clear();markDirty();render();toast(val?`已置顶 ${n} 项`:`已取消置顶 ${n} 项`);}
function copyLink(idx){const item=data.lines[idx];if(!item)return;const url=item.url.startsWith("http")?item.url:"https://"+item.url;navigator.clipboard.writeText(url).then(()=>toast("链接已复制")).catch(()=>toast("复制失败"));}

function openAddModal(){editIdx=null;document.getElementById("modalTitle").innerHTML='<i class="fa-solid fa-plus"></i> 添加网站';document.getElementById("m_name").value=document.getElementById("name").value.trim();document.getElementById("m_url").value=document.getElementById("url").value.trim();document.getElementById("m_category").value=document.getElementById("category").value.trim();document.getElementById("m_note").value=document.getElementById("note").value.trim();document.getElementById("dupWarn").style.display="none";document.getElementById("editModal").classList.add("show");setTimeout(()=>document.getElementById("m_name").focus(),30);}
function openEditModal(idx){const item=data.lines[idx];if(!item)return;editIdx=idx;document.getElementById("modalTitle").innerHTML='<i class="fa-solid fa-pen"></i> 编辑网站';document.getElementById("m_name").value=item.name||"";document.getElementById("m_url").value=item.url||"";document.getElementById("m_category").value=item.category||"";document.getElementById("m_note").value=item.note||"";document.getElementById("dupWarn").style.display="none";document.getElementById("editModal").classList.add("show");setTimeout(()=>document.getElementById("m_name").focus(),30);}
function closeModal(){document.getElementById("editModal").classList.remove("show");editIdx=null;}
function checkDup(url){const norm=url.replace(/\/$/,"").toLowerCase();return data.lines.some((item,i)=>{if(editIdx!==null&&i===editIdx)return false;return(item.url||"").replace(/\/$/,"").toLowerCase()===norm;});}
function saveModal(){const n=document.getElementById("m_name").value.trim(),u=document.getElementById("m_url").value.trim(),c=document.getElementById("m_category").value.trim()||"未分类",note=document.getElementById("m_note").value.trim();if(!n||!u)return toast("名称和链接不能为空");if(checkDup(u)){document.getElementById("dupWarn").style.display="block";if(!confirm("已存在相同链接，仍要保存吗？"))return;}if(editIdx===null){data.lines.push({name:n,url:u,category:c,note,count:0,pinned:false,created:Date.now()});document.getElementById("name").value="";document.getElementById("url").value="";document.getElementById("note").value="";toast("已添加");}else{const item=data.lines[editIdx];item.name=n;item.url=u;item.category=c;item.note=note;toast("已更新");}markDirty();closeModal();render();}

function openCatColorModal(){const cats=[...new Set((data.lines||[]).map(i=>i.category||"未分类"))];const el=document.getElementById("catColorList");if(!cats.length)el.innerHTML=`<p style="color:var(--text-secondary);font-size:12px">暂无分类</p>`;else el.innerHTML=cats.map(cat=>{const cur=getCatColor(cat);const dots=CAT_COLORS.map(c=>`<div class="color-dot ${c===cur?'selected':''}" style="background:${c}" onclick="setCatColor('${escapeHtml(cat)}','${c}')"></div>`).join("");return`<div style="margin-bottom:10px"><div style="font-size:12.5px;font-weight:600;margin-bottom:4px">${escapeHtml(cat)}</div><div class="color-picker">${dots}</div></div>`;}).join("");document.getElementById("catColorModal").classList.add("show");}
function setCatColor(cat,color){if(!data.catColors)data.catColors={};data.catColors[cat]=color;markDirty();openCatColorModal();renderFront();toast("颜色已更新");}
function closeCatColorModal(){document.getElementById("catColorModal").classList.remove("show");}
function openThemeModal(){const cur=localStorage.getItem("nav_primary")||"#165DFF";document.getElementById("themeColorPicker").innerHTML=THEME_COLORS.map(c=>`<div class="color-dot ${c===cur?'selected':''}" style="background:${c}" onclick="setThemeColor('${c}')"></div>`).join("");document.getElementById("themeModal").classList.add("show");}
function setThemeColor(c){applyPrimary(c);openThemeModal();toast("主题色已更新");}
function closeThemeModal(){document.getElementById("themeModal").classList.remove("show");}
function openPwdModal(){document.getElementById("pwd_old").value="";document.getElementById("pwd_new").value="";document.getElementById("pwd_confirm").value="";document.getElementById("pwdModal").classList.add("show");}
function closePwdModal(){document.getElementById("pwdModal").classList.remove("show");}
function changePwd(){const old=document.getElementById("pwd_old").value,nw=document.getElementById("pwd_new").value,conf=document.getElementById("pwd_confirm").value;if(old!==adminPwd)return toast("当前密码错误");if(!nw||nw.length<4)return toast("新密码至少4位");if(nw!==conf)return toast("两次输入不一致");adminPwd=nw;localStorage.setItem("nav_admin_pwd",nw);closePwdModal();toast("密码已修改");}

function go(realIdx){const item=data.lines[realIdx];if(!item)return;item.count=(item.count||0)+1;if(!data.recent)data.recent=[];data.recent=data.recent.filter(r=>!(r.url===item.url&&r.name===item.name));data.recent.unshift({name:item.name,url:item.url,category:item.category,time:Date.now()});if(data.recent.length>20)data.recent=data.recent.slice(0,20);markDirty();window.open(item.url.startsWith("http")?item.url:"https://"+item.url,"_blank");render();}
function togglePin(idx){const item=data.lines[idx];if(!item)return;item.pinned=!item.pinned;markDirty();render();toast(item.pinned?"已置顶":"已取消置顶");}
function del(realIdx){const item=data.lines[realIdx];if(!item)return;if(!confirm(`确定删除「${item.name}」吗？`))return;lastDeleted={items:[item],idxs:[realIdx]};data.lines.splice(realIdx,1);const newSet=new Set();selected.forEach(i=>{if(i>realIdx)newSet.add(i-1);else if(i<realIdx)newSet.add(i);});selected=newSet;markDirty();render();showUndo(`已删除「${item.name}」`);}
function showUndo(text){document.getElementById("undoText").textContent=text;document.getElementById("undoBar").classList.add("show");clearTimeout(undoTimer);undoTimer=setTimeout(()=>{document.getElementById("undoBar").classList.remove("show");lastDeleted=null;},5000);}
function undoDelete(){if(!lastDeleted)return;lastDeleted.idxs.forEach((idx,i)=>data.lines.splice(idx,0,lastDeleted.items[i]));lastDeleted=null;document.getElementById("undoBar").classList.remove("show");clearTimeout(undoTimer);markDirty();render();toast("已撤销删除");}
function toggleBatchArea(){const el=document.getElementById("batchArea");el.style.display=el.style.display==="none"?"block":"none";}
function batchAdd(){const t=document.getElementById("batch").value.trim();if(!t)return toast("请输入内容");let count=0;t.split("\n").forEach(line=>{const parts=line.split("|").map(s=>s.trim());if(parts.length>=2&&parts[0]&&parts[1]){data.lines.push({name:parts[0],url:parts[1],category:parts[2]||"未分类",note:parts[3]||"",count:0,pinned:false,created:Date.now()});count++;}});document.getElementById("batch").value="";document.getElementById("batchArea").style.display="none";markDirty();render();toast(`成功添加 ${count} 条`);}

function dragStart(e,idx){dragSrcIdx=idx;e.currentTarget.style.opacity="0.4";}
function dragOver(e){e.preventDefault();}
function drop(e,targetIdx){e.preventDefault();if(dragSrcIdx===null||dragSrcIdx===targetIdx)return;const item=data.lines.splice(dragSrcIdx,1)[0];data.lines.splice(targetIdx,0,item);selected.clear();dragSrcIdx=null;markDirty();render();}
function dragEnd(e){e.currentTarget.style.opacity="1";dragSrcIdx=null;}

async function loadFromKV(){try{const r=await fetch(`${KV_API}/get?t=${Date.now()}`);const d=await r.json();if(d&&Array.isArray(d.lines))data=d;if(!data.catColors)data.catColors={};if(!data.recent)data.recent=[];data.lines.forEach(normalizeItem);localStorage.setItem("nav_data_backup",JSON.stringify(data));markClean();render();renderFront();}catch(e){const backup=localStorage.getItem("nav_data_backup");if(backup){try{data=JSON.parse(backup);if(!data.catColors)data.catColors={};if(!data.recent)data.recent=[];data.lines.forEach(normalizeItem);toast("云端加载失败，已使用本地备份");render();renderFront();return;}catch{}}toast("加载失败");}}
async function saveToKV(){try{const res=await fetch(`${KV_API}/set`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:SAVE_PWD,data})});if(!res.ok)throw new Error("HTTP "+res.status);localStorage.setItem("nav_data_backup",JSON.stringify(data));markClean();toast("同步成功");}catch(e){toast("同步失败，请检查网络");}}
function exportJSON(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`nav-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast("已导出");}
function importJSON(){const input=document.createElement("input");input.type="file";input.accept=".json";input.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const parsed=JSON.parse(ev.target.result);if(!parsed.lines||!Array.isArray(parsed.lines))throw new Error("格式错误");if(!confirm(`将导入 ${parsed.lines.length} 条数据，覆盖当前数据？`))return;data=parsed;if(!data.catColors)data.catColors={};if(!data.recent)data.recent=[];data.lines.forEach(normalizeItem);selected.clear();markDirty();render();toast("导入成功");}catch{toast("导入失败，文件格式不正确");}};reader.readAsText(file);};input.click();}

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(!localStorage.getItem("nav_install_dismissed"))document.getElementById("installBanner").classList.add("show");});
function installPWA(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById("installBanner").classList.remove("show");});}
function dismissInstall(){document.getElementById("installBanner").classList.remove("show");localStorage.setItem("nav_install_dismissed","1");}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModal();closeCatColorModal();closePwdModal();closeThemeModal();return;}
  const tag=e.target.tagName;if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  if(e.key==="/"||e.key==="？"){e.preventDefault();document.getElementById("f_search")?.focus();}
  else if(e.key==="t"||e.key==="T")toggleTheme();
  else if(e.key==="d"||e.key==="D")toggleDensity();
  else if(e.key==="s"||e.key==="S")showStats();
  else if(e.key==="p"||e.key==="P")togglePinFilter();
});
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});

initTheme();initDensity();initPrimary();loadFromKV();showFront();
</script>
</body>
</html>
