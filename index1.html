.drag-handle{
  position:absolute;right:8px;top:8px;color:var(--text-secondary);
  opacity:.35;cursor:grab;z-index:2;
}
.drag-handle:active{cursor:grabbing}
.card.dragging{opacity:.45;transform:scale(.98)}
.card.drag-over{outline:2px dashed var(--primary);outline-offset:2px}
.stats-grid-v8{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0;
}
.stat-box-v8{
  background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;
}
.stat-box-v8 b{display:block;font-size:18px;margin-bottom:2px}
.stat-box-v8 span{font-size:10px;color:var(--text-secondary)}
.backup-list{
  max-height:220px;overflow:auto;border:1px solid var(--border);
  border-radius:10px;margin-top:8px;
}
.backup-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-bottom:1px solid var(--border);font-size:10.5px;
}
.backup-item:last-child{border-bottom:0}
.backup-item .meta{margin-right:auto;color:var(--text-secondary)}
.v8-progress{
  height:3px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:5px;
}
.v8-progress>i{display:block;height:100%;width:0;background:var(--primary);transition:width .25s}
.health-dot{
  width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--text-secondary);
}
.health-dot.ok{background:var(--success)}
.health-dot.bad{background:var(--danger)}
.health-dot.busy{background:var(--warning);animation:v8pulse 1s infinite}
@keyframes v8pulse{50%{opacity:.35}}
@media(max-width:760px){
  .stats-grid-v8{grid-template-columns:repeat(2,minmax(0,1fr))}
}


/* ===== v12.0 Ultimate Pro ===== */
:root{
  --v9-radius:16px;
  --v9-shadow:0 16px 50px rgba(0,0,0,.12);
}
[data-theme="dark"]{--v9-shadow:0 16px 50px rgba(0,0,0,.34)}
.card{transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease}
.card:hover{box-shadow:var(--v9-shadow)}
.v9-command-hint{
  position:fixed;right:14px;bottom:14px;z-index:30;
  padding:6px 9px;border:1px solid var(--border);border-radius:8px;
  background:var(--card);color:var(--text-secondary);font-size:10px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);opacity:.8
}
.v9-dashboard{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0;
}
.v9-stat{
  border:1px solid var(--border);background:var(--bg);border-radius:12px;
  padding:10px;min-width:0
}
.v9-stat b{font-size:18px;display:block}
.v9-stat span{font-size:10px;color:var(--text-secondary)}
.v9-meter{height:5px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:7px}
.v9-meter i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s}
.v9-health{
  display:flex;align-items:center;gap:7px;padding:8px 10px;
  border:1px solid var(--border);border-radius:10px;background:var(--bg);
  font-size:10.5px;color:var(--text-secondary)
}
.v9-health-dot{width:8px;height:8px;border-radius:50%;background:var(--text-secondary)}
.v9-health-dot.ok{background:var(--success)}
.v9-health-dot.warn{background:var(--warning)}
.v9-health-dot.bad{background:var(--danger)}
.v9-health-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.v9-empty{
  text-align:center;padding:30px 15px;color:var(--text-secondary);
  border:1px dashed var(--border);border-radius:12px;font-size:12px
}
@media(max-width:900px){.v9-dashboard{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.v9-dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.v9-command-hint{display:none}}


/* ===== v16.0 Ultimate stability / accessibility / mobile layer ===== */
:root{
  --v16-glow: 0 0 0 3px var(--primary-light);
  --v16-card-gap: 10px;
}
html{color-scheme:light}
[data-theme="dark"]{color-scheme:dark}
body{overscroll-behavior-y:contain}
button,.icon-circle,.icon-btn,.engine-btn,.category-btn,.filter-btn,.admin-entry,.card{touch-action:manipulation}
button:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:2px;
}
.card[tabindex]{outline-offset:2px}
.card[tabindex]:focus-visible{box-shadow:var(--v9-shadow),var(--v16-glow)}
.search-clear{z-index:2}
.modal-mask{overscroll-behavior:contain}
.modal{scrollbar-width:thin}
@media(max-width:600px){
  #front{padding-left:10px;padding-right:10px}
  .header-actions{position:static;justify-content:center;margin-top:8px}
  .header-actions .icon-circle{width:34px;height:34px}
  .time-widget{font-size:26px}
  .search-engine-selector{gap:5px;overflow-x:auto;justify-content:flex-start;padding:0 2px;scrollbar-width:none}
  .search-engine-selector::-webkit-scrollbar{display:none}
  .engine-btn{flex:0 0 auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .admin-card{padding:9px 7px}
  .admin-card .actions{gap:2px}
  .admin-card .icon-btn{width:28px;height:28px}
}
@media(min-width:601px){
  .grid{gap:var(--v16-card-gap)}
}

/* v16.0 hardening */
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}


/* ===== v16.0 precision hardening ===== */
:root{--v16-focus:2px}
:focus-visible{outline:var(--v16-focus) solid var(--primary);outline-offset:2px}
button,.icon-btn,.icon-circle,.card,.category-btn,.filter-btn{touch-action:manipulation}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media(max-width:600px){
  input,select,textarea{font-size:16px}
  .modal{max-height:calc(100dvh - 24px);overflow:auto}
}

<script>
const API_CONFIG = Object.freeze({
  baseUrl: "https://jj.xiaohe1999.dpdns.org",
  getPath: "/get",
  setPath: "/set",
  timeout: 10000
});
const DEFAULT_ADMIN_PWD="778899";
// API 配置集中管理：前端只保存当前会话的同步密码，不再把云端写入密码硬编码进源码。
const CAT_COLORS=["#165DFF","#00b42a","#f53f3f","#ff7d00","#722ed1","#0fc6c2","#f7ba1e","#eb2f96","#3491fa","#86909c"];
const THEME_COLORS=["#165DFF","#00b42a","#f53f3f","#ff7d00","#722ed1","#0fc6c2","#eb2f96","#3491fa","#1d2129","#86909c"];
let data={lines:[],catColors:{},recent:[]},currentCat="全部",pinOnly=false,dragSrcIdx=null,editIdx=null;
let adminSelected=new Set(),rankTab="visits",lastDeleted=null,undoTimer=null,dirty=false;
let adminPwd=localStorage.getItem("nav_admin_pwd")||DEFAULT_ADMIN_PWD,deferredPrompt=null;
let currentEngine="local",autoSyncTimer=null,autoSyncEnabled=localStorage.getItem("nav_auto_sync")==="1",lastSyncAt=Number(localStorage.getItem("nav_last_sync")||0);

const ENGINES = {
  local: { name: "本地", url: "" },
  baidu: { name: "百度", url: "https://www.baidu.com/s?wd=" },
  google: { name: "谷歌", url: "https://www.google.com/search?q=" },
  bing: { name: "Bing", url: "https://cn.bing.com/search?q=" },
  github: { name: "GitHub", url: "https://github.com/search?q=" }
};

function apiUrl(path){
  return `${API_CONFIG.baseUrl.replace(/\/+$/,"")}${path}`;
}
async function fetchWithTimeout(url, options={}){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), API_CONFIG.timeout);
  try{
    return await fetch(url, {...options, signal:controller.signal, cache:"no-store"});
  }finally{
    clearTimeout(timer);
  }
}
function setSyncDot(state,title){
  const dot=document.getElementById("syncDot");
  if(!dot)return;
  dot.classList.remove("pending","error");
  if(state==="pending")dot.classList.add("pending");
  if(state==="error")dot.classList.add("error");
  dot.title=title;
}
function getSyncPassword(){

/* ---------- v8 selection / batch operations ---------- */
const v8Selected = new Set();
let v8DragIndex = null;

function refreshSelectionUI(){
  const bar=document.getElementById("selectionBar");
  const count=document.getElementById("selectionCount");
  if(!bar||!count)return;
  count.textContent=`已选择 ${v8Selected.size} 项`;
  bar.classList.toggle("show",v8Selected.size>0);
  document.querySelectorAll(".card-select").forEach(cb=>{
    const idx=Number(cb.dataset.index);
    cb.checked=v8Selected.has(idx);
    cb.closest(".card")?.classList.toggle("selected",cb.checked);
  });
}
function toggleSelected(idx,checked){
  if(checked)v8Selected.add(idx);else v8Selected.delete(idx);
  refreshSelectionUI();
}
function selectAllVisible(){
  const visible=[...document.querySelectorAll(".card-select")].map(x=>Number(x.dataset.index));
  visible.forEach(i=>v8Selected.add(i));
  refreshSelectionUI();
}
function clearSelection(){v8Selected.clear();refreshSelectionUI();}
function batchPinSelected(){
  if(!v8Selected.size)return;
  v8Selected.forEach(i=>{if(data.lines[i])data.lines[i].pinned=true;});
  markDirty();clearSelection();render();toast("已批量置顶");
}
function batchDeleteSelected(){
  if(!v8Selected.size)return;
  if(!confirm(`确定删除选中的 ${v8Selected.size} 项吗？`))return;
  v9SafeSnapshot("before-batch-delete");
  const indexes=[...v8Selected].sort((a,b)=>b-a);
  indexes.forEach(i=>data.lines.splice(i,1));
  markDirty();clearSelection();render();toast("已批量删除");
}
function wireV8Cards(){
  document.querySelectorAll(".card").forEach((card)=>{
    const idx=Number(card.dataset.index);
    if(!Number.isInteger(idx))return;
    card.classList.add("selectable");
    if(!card.querySelector(".card-select")){
      const cb=document.createElement("input");
      cb.type="checkbox";cb.className="card-select";cb.dataset.index=idx;
      cb.title="选择此网站";
      cb.addEventListener("click",e=>e.stopPropagation());
      cb.addEventListener("change",e=>toggleSelected(idx,e.target.checked));
      card.appendChild(cb);
    }
    if(!card.querySelector(".drag-handle")){
      const h=document.createElement("i");
      h.className="fa-solid fa-grip-vertical drag-handle";
      h.title="拖动排序";
      card.appendChild(h);
      card.draggable=true;
      card.addEventListener("dragstart",()=>{
        v8DragIndex=idx;card.classList.add("dragging");
      });
      card.addEventListener("dragend",()=>{
        v8DragIndex=null;card.classList.remove("dragging");
        document.querySelectorAll(".card.drag-over").forEach(x=>x.classList.remove("drag-over"));
      });
      card.addEventListener("dragover",e=>{
        if(v8DragIndex===null||v8DragIndex===idx)return;
        e.preventDefault();card.classList.add("drag-over");
      });
      card.addEventListener("dragleave",()=>card.classList.remove("drag-over"));
      card.addEventListener("drop",e=>{
        e.preventDefault();card.classList.remove("drag-over");
        if(v8DragIndex===null||v8DragIndex===idx)return;
        const moved=data.lines.splice(v8DragIndex,1)[0];
        data.lines.splice(idx,0,moved);
        markDirty();render();toast("排序已更新");
      });
    }
  });
  refreshSelectionUI();
}

/* ---------- v8 local versioned backups ---------- */
const V8_BACKUPS_KEY="nav_v8_backups";
function makeV8Backup(reason="manual"){
  try{
    const raw=JSON.stringify(data);
    const backups=JSON.parse(localStorage.getItem(V8_BACKUPS_KEY)||"[]");
    backups.unshift({time:Date.now(),reason,size:raw.length,data});
    localStorage.setItem(V8_BACKUPS_KEY,JSON.stringify(backups.slice(0,8)));
  }catch(e){console.warn("backup failed",e);}
}
function getV8Backups(){
  try{return JSON.parse(localStorage.getItem(V8_BACKUPS_KEY)||"[]");}catch{return [];}
}
function restoreV8Backup(index){
  const b=getV8Backups()[index];
  if(!b)return toast("备份不存在");
  if(!confirm("恢复此备份后，当前未同步的数据将被替换。确定继续吗？"))return;
  data=b.data;
  data.lines=(data.lines||[]).map(normalizeItem);
  if(!data.catColors)data.catColors={};
  if(!data.recent)data.recent=[];
  markDirty();render();renderFront();toast("备份已恢复");
}
function renderV8Backups(){
  const el=document.getElementById("v8BackupList");
  if(!el)return;
  const list=getV8Backups();
  el.innerHTML=list.length?list.map((b,i)=>{
    const time=new Date(b.time).toLocaleString();
    return `<div class="backup-item"><span class="meta">${escapeHtml(time)} · ${escapeHtml(b.reason||"backup")}</span><button class="btn btn-sm btn-secondary" onclick="restoreV8Backup(${i})">恢复</button></div>`;
  }).join(""):'<div class="backup-item"><span class="meta">暂无本地版本备份</span></div>';
}

/* ---------- v8 JSON import with preview ---------- */
function openV8JsonPicker(){document.getElementById("v8JsonInput")?.click();}
function handleV8JsonFile(e){
  const file=e.target.files?.[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const obj=JSON.parse(reader.result);
      const lines=Array.isArray(obj)?obj:obj.lines;
      if(!Array.isArray(lines))throw new Error("JSON 中没有 lines 数组");
      const normalized=lines.map(normalizeItem);
      const existing=new Set(data.lines.map(x=>x.url.replace(/\/$/,"").toLowerCase()));
      let add=0;
      normalized.forEach(item=>{
        const key=item.url.replace(/\/$/,"").toLowerCase();
        if(item.name&&item.url&&!existing.has(key)){data.lines.push(item);existing.add(key);add++;}
      });
      v9SafeSnapshot("before-import");
      makeV8Backup("before-import");
      markDirty();render();renderFront();
      toast(`导入完成：新增 ${add} 条，重复项已自动跳过`);
    }catch(err){toast("导入失败：JSON 格式无效");}
    e.target.value="";
  };
  reader.readAsText(file);
}

function v9GetStats(){
  const lines=Array.isArray(data?.lines)?data.lines:[];
  const categories=new Set(lines.map(x=>x.category||"未分类"));
  const pinned=lines.filter(x=>x.pinned).length;

async function v9CheckEndpoint(label,url,options={}){
  const dot=document.querySelector(`[data-v9-health="${label}"]`);
  if(dot)dot.className="v9-health-dot warn";
  const started=performance.now();
  try{
    const r=await fetchWithTimeout(url,options);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const ms=Math.round(performance.now()-started);
    if(dot)dot.className="v9-health-dot ok";
    return {ok:true,ms,status:r.status};
  }catch(e){
    if(dot)dot.className="v9-health-dot bad";
    return {ok:false,ms:Math.round(performance.now()-started),error:e};
  }
}

let commandIndex=0;

function openCommandPalette(){
  const mask=document.getElementById("commandPalette");
  if(!mask)return;
  mask.classList.add("show");
  const input=document.getElementById("commandInput");
  input.value="";
  commandIndex=0;
  renderCommands("");
  setTimeout(()=>input.focus(),30);
}
function closeCommandPalette(){
  document.getElementById("commandPalette")?.classList.remove("show");
}
function renderCommands(keyword){
  const q=(keyword||"").trim().toLowerCase();
  const list=COMMANDS.filter(c=>!q || c.name.toLowerCase().includes(q) || c.keys.some(k=>k.toLowerCase().includes(q)));
  const el=document.getElementById("commandList");
  if(!list.length){el.innerHTML='<div class="command-empty">没有匹配的功能</div>';return;}
  commandIndex=Math.min(commandIndex,list.length-1);
  el.innerHTML=list.map((c,i)=>`<div class="command-item ${i===commandIndex?"active":""}" onclick="runCommand(${COMMANDS.indexOf(c)})"><i class="fa-solid ${c.icon}"></i><span>${escapeHtml(c.name)}</span></div>`).join("");
}
function runCommand(idx){
  const c=COMMANDS[idx];
  if(!c)return;
  closeCommandPalette();
  try{c.run();}catch(e){toast("操作失败");console.error(e);}
}
function handleCommandKey(e){
  const items=document.querySelectorAll("#commandList .command-item");
  if(e.key==="ArrowDown"){e.preventDefault();commandIndex=Math.min(commandIndex+1,items.length-1);renderCommands(document.getElementById("commandInput").value);}
  else if(e.key==="ArrowUp"){e.preventDefault();commandIndex=Math.max(commandIndex-1,0);renderCommands(document.getElementById("commandInput").value);}
  else if(e.key==="Enter"){e.preventDefault();if(items.length)runCommand(COMMANDS.findIndex(c=>c.name===items[commandIndex]?.innerText));}
  else if(e.key==="Escape"){e.preventDefault();closeCommandPalette();}
}

function normalizeItem(i){

  i.name=String(i.name||"未命名").trim();

function renderFront(){

  if(!list.length){el.innerHTML=`<div class="empty-state"><i class="fa-regular fa-folder-open"></i><p>${pinOnly?"暂无置顶网站":"暂无网站"}</p></div>`;return;}
  el.innerHTML=list.map(item=>{
    const realIndex=data.lines.indexOf(item);
    const fav=getFavicon(item.url),first=(item.name||"?").charAt(0).toUpperCase();
    const icon=fav?`<img src="${escapeHtml(fav)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="fallback" style="display:none">${escapeHtml(first)}</span>`:`<span class="fallback">${escapeHtml(first)}</span>`;
    const pinCls=item.pinned?"pinned":"",pinBadge=item.pinned?`<span class="pin-badge"><i class="fa-solid fa-thumbtack"></i></span>`:"";
    const color=getCatColor(item.category||"未分类"),title=item.note?`${escapeHtml(item.name)} - ${escapeHtml(item.note)}`:escapeHtml(item.name);
    return`<div class="card ${pinCls}" data-index="${realIndex}" tabindex="0" title="${title}">
      ${pinBadge}
      <div class="icon-wrap">${icon}</div>
      <div class="name">${escapeHtml(item.name)}</div>
      <div class="cat"><span class="dot" style="background:${escapeHtml(color)}"></span>${escapeHtml(item.category||"未分类")}</div>
    </div>`;
  }).join("");
  el.querySelectorAll(".card[data-index]").forEach(card=>{
    const idx=Number(card.dataset.index);
    const open=()=>{const item=data.lines[idx];if(item)openLink(item.url,item.name);};
    card.addEventListener("click",open);
    card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
  });
}

function openLink(url,name){
  const item=data.lines.find(i=>i.url===url&&i.name===name);
  if(item){item.count=(item.count||0)+1;if(!data.recent)data.recent=[];data.recent=data.recent.filter(r=>!(r.url===url&&r.name===name));data.recent.unshift({name:item.name,url:item.url,category:item.category,time:Date.now()});if(data.recent.length>20)data.recent=data.recent.slice(0,20);markDirty();}
  window.location.href=url.startsWith("http")?url:"https://"+url;
}

function switchRankTab(tab,btn){rankTab=tab;document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderStats();}
function renderStats(){
  const lines=data.lines||[],total=lines.length,totalVisits=lines.reduce((s,i)=>s+(i.count||0),0),pinned=lines.filter(i=>i.pinned).length,cats=new Set(lines.map(i=>i.category||"未分类")).size;
  document.getElementById("statsOverview").innerHTML=`<span><i class="fa-solid fa-link"></i> ${total} 网站</span><span><i class="fa-solid fa-eye"></i> ${totalVisits} 访问</span><span><i class="fa-solid fa-folder"></i> ${cats} 分类</span><span><i class="fa-solid fa-thumbtack"></i> ${pinned} 置顶</span>`;
  const el=document.getElementById("rankList");
  if(rankTab==="visits"){
    const sorted=[...lines].sort((a,b)=>(b.count||0)-(a.count||0)).slice(0,30);
    if(!sorted.length){el.innerHTML=`<div class="empty-state" style="padding:24px"><p>暂无数据</p></div>`;return;}
    el.innerHTML=sorted.map((item,i)=>{const numCls=i===0?"gold":i===1?"silver":i===2?"bronze":"";
      return`<div class="rank-item" onclick='openLink(${JSON.stringify(item.url)},${JSON.stringify(item.name)})' style="cursor:pointer"><div class="rank-num ${numCls}">${i+1}</div><div class="rank-info"><div class="name">${escapeHtml(item.name)}</div><div class="meta">${escapeHtml(item.category||"未分类")} · ${escapeHtml(getDomain(item.url))}</div></div><div class="rank-count">${item.count||0}</div></div>`;}).join("");
  }else if(rankTab==="category"){
    const catMap={};lines.forEach(i=>{const c=i.category||"未分类";if(!catMap[c])catMap[c]={count:0,visits:0};catMap[c].count++;catMap[c].visits+=(i.count||0);});
    const sorted=Object.entries(catMap).sort((a,b)=>b[1].visits-a[1].visits);
    el.innerHTML=sorted.map(([name,info],i)=>{const numCls=i===0?"gold":i===1?"silver":i===2?"bronze":"",color=getCatColor(name);
      return`<div class="rank-item"><div class="rank-num ${numCls}">${i+1}</div><div class="rank-info"><div class="name"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${color};margin-right:4px"></span>${escapeHtml(name)}</div><div class="meta">${info.count} 个网站</div></div><div class="rank-count">${info.visits}</div></div>`;}).join("");
  }else{
    const recent=data.recent||[];
    if(!recent.length){el.innerHTML=`<div class="empty-state" style="padding:24px"><p>暂无最近访问记录</p></div>`;return;}
    el.innerHTML=recent.map((item,i)=>{const timeStr=item.time?new Date(item.time).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
      return`<div class="rank-item" onclick='openLink(${JSON.stringify(item.url)},${JSON.stringify(item.name)})' style="cursor:pointer"><div class="rank-num">${i+1}</div><div class="rank-info"><div class="name">${escapeHtml(item.name)}</div><div class="meta">${escapeHtml(item.category||"未分类")} · ${timeStr}</div></div><div class="rank-count"><i class="fa-solid fa-clock-rotate-left" style="font-size:12px"></i></div></div>`;}).join("");
  }
}

function go(realIdx){const item=data.lines[realIdx];if(!item)return;item.count=(item.count||0)+1;if(!data.recent)data.recent=[];data.recent=data.recent.filter(r=>!(r.url===item.url&&r.name===item.name));data.recent.unshift({name:item.name,url:item.url,category:item.category,time:Date.now()});if(data.recent.length>20)data.recent=data.recent.slice(0,20);markDirty();window.location.href=item.url.startsWith("http")?item.url:"https://"+item.url;}

function del(realIdx){
  const item=data.lines[realIdx];
  if(!item)return;
  if(!confirm(`确定删除「${item.name}」吗？`))return;
  lastDeleted={items:[item],idxs:[realIdx]};
  data.lines.splice(realIdx,1);
  const newSet=new Set();
  adminSelected.forEach(i=>{
    if(i>realIdx) newSet.add(i-1);
    else if(i<realIdx) newSet.add(i);
  });
  adminSelected.clear();
  newSet.forEach(i=>adminSelected.add(i));
  try{ if(typeof v8Selected!=="undefined") v8Selected.clear(); }catch(_){}
  markDirty();
  render();
  showUndo(`已删除「${item.name}」`);
}
function showUndo(text){document.getElementById("undoText").textContent=text;document.getElementById("undoBar").classList.add("show");clearTimeout(undoTimer);undoTimer=setTimeout(()=>{document.getElementById("undoBar").classList.remove("show");lastDeleted=null;},5000);}
function undoDelete(){if(!lastDeleted)return;lastDeleted.idxs.forEach((idx,i)=>data.lines.splice(idx,0,lastDeleted.items[i]));lastDeleted=null;document.getElementById("undoBar").classList.remove("show");clearTimeout(undoTimer);markDirty();render();toast("已撤销删除");}
function toggleBatchArea(){const el=document.getElementById("batchArea");el.style.display=el.style.display==="none"?"block":"none";}
function batchAdd(){
  const t=document.getElementById("batch").value.trim();
  if(!t)return toast("请输入内容");
  let count=0;
  t.split(/\r?\n/).forEach(line=>{
    const parts=line.split("|").map(s=>s.trim());
    if(parts.length>=2&&parts[0]&&parts[1]){
      let url=parts[1];
      if(!/^https?:\/\//i.test(url))url="https://"+url;
      data.lines.push(normalizeItem({name:parts[0],url,category:parts[2]||"未分类",note:parts[3]||"",count:0,pinned:false,created:Date.now()}));
      count++;
    }
  });
  document.getElementById("batch").value="";
  document.getElementById("batchArea").style.display="none";
  if(count){markDirty();render();}
  toast(`成功添加 ${count} 条`);
}

/* HTML 浏览器书签导入解析程序 */
function importBookmarks() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".html";
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(ev.target.result, "text/html");
        const links = doc.querySelectorAll("a");
        let addedCount = 0;
        
        links.forEach(a => {
          const title = a.textContent.trim();
          const href = a.getAttribute("href");
          if(title && href && /^https?:\/\//i.test(href)) {
            // 获取所在的 H3 文件夹名称作为分类
            let cat = "导入书签";
            let parent = a.closest("dl");
            if(parent) {
              let prev = parent.previousElementSibling;
              if(prev && prev.tagName === "H3") cat = prev.textContent.trim();
            }
            data.lines.push({ name: title, url: href, category: cat, note: "", count: 0, pinned: false, created: Date.now() });
            addedCount++;
          }
        });
        
        if(addedCount > 0) {
          markDirty();
          render();
          toast(`成功从书签导入 ${addedCount} 个网址！`);
        } else toast("未在文件中找到有效的书签");
      } catch(ex) {
        toast("解析书签文件失败");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

async function checkApiHealth(){
  setSyncDot("pending","正在检测 API");
  try{
    const r=await fetchWithTimeout(`${apiUrl(API_CONFIG.getPath)}?health=1&t=${Date.now()}`);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    setSyncDot("clean","API 在线");
    toast(`API 在线 · HTTP ${r.status}`);
  }catch(e){
    setSyncDot("error","API 不可用");
    toast(e.name==="AbortError"?"API 检测超时":"API 无法连接");
  }
}

async function loadFromKV(){
  setSyncDot("pending","正在加载云端数据");
  try{
    const r=await fetchWithTimeout(`${apiUrl(API_CONFIG.getPath)}?t=${Date.now()}`);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    if(!d || !Array.isArray(d.lines))throw new Error("云端数据格式无效");
    data=d;
    if(!data.catColors)data.catColors={};
    if(!data.recent)data.recent=[];
    data.lines.forEach(normalizeItem);
    localStorage.setItem("nav_data_backup",JSON.stringify(data));
    markClean();
    updateLastSyncText();
    render();renderFront();
  }catch(e){
    setSyncDot("error","云端加载失败，已使用本地备份");
    const backup=localStorage.getItem("nav_data_backup");
    if(backup){
      try{
        data=JSON.parse(backup);
        if(!data.catColors)data.catColors={};
        if(!data.recent)data.recent=[];
        data.lines.forEach(normalizeItem);
        render();renderFront();
        toast("云端加载失败，已使用本地备份");
        return;
      }catch{}
    }
    render();renderFront();
    toast(e.name==="AbortError"?"云端请求超时":"云端加载失败");
  }
}
async function saveToKV(silent=false){
  let password=getSyncPassword();
  if(!password){
    password=prompt("请输入云端 API 同步密码：");
    if(password===null)return;
    password=password.trim();
    if(!password)return toast("同步密码不能为空");
    sessionStorage.setItem("nav_sync_pwd",password);
  }
  setSyncDot("pending","正在同步云端");
  try{
    const res=await fetchWithTimeout(apiUrl(API_CONFIG.setPath),{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password,data})
    });
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    localStorage.setItem("nav_data_backup",JSON.stringify(data));
    lastSyncAt=Date.now();
    localStorage.setItem("nav_last_sync",String(lastSyncAt));
    markClean();
    updateLastSyncText();
    if(!silent)toast("同步成功");
  }catch(e){
    setSyncDot("error","同步失败");
    if(!silent)toast(e.name==="AbortError"?"同步请求超时":"同步失败，请检查 API 或同步密码");
  }
}
function exportJSON(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`nav-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast("已导出");}
function importJSON(){const input=document.createElement("input");input.type="file";input.accept=".json";input.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const parsed=JSON.parse(ev.target.result);if(!parsed.lines||!Array.isArray(parsed.lines))throw new Error("格式错误");if(!confirm(`将导入 ${parsed.lines.length} 条数据，覆盖当前数据？`))return;
        localStorage.setItem("nav_pre_import_backup",JSON.stringify(data));
        data=parsed;

    if(!hadLocal){
      v17Status(navigator.onLine?"正在加载导航数据…":"离线模式 · 等待本地数据");
    }
    try{document.documentElement.dataset.navVersion=V17}catch(_){ }
  };
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});
  else boot();
})();
</script>

<script>
/* ===== v17.0 Precision Upgrade layer ===== */
(function(){
"use strict";
const V="17.0", KEY="nav_v17_state", MAX=80;
let undoStack=[], redoStack=[], timer=0, autosaveTimer=0;

function clone(x){try{return JSON.parse(JSON.stringify(x))}catch(_){return null}}
function sig(x){try{return JSON.stringify(x)}catch(_){return ""}}
function validData(x){
  const o=clone(x);
  if(!o || !Array.isArray(o.lines)) return null;
  o.lines=o.lines.map((x,i)=>({
    name:String(x?.name??"").trim(),
    url:String(x?.url??"").trim(),
    category:String(x?.category??"未分类").trim()||"未分类",
    note:String(x?.note??"").trim(),
    icon:String(x?.icon??"").trim(),
    count:Number.isFinite(Number(x?.count))?Math.max(0,Number(x.count)):0,
    pinned:!!x?.pinned,
    created:Number(x?.created)||Date.now(),
    _order:i
  })).filter(x=>x.name||x.url);
  if(!o.catColors||typeof o.catColors!=="object")o.catColors={};
  if(!Array.isArray(o.recent))o.recent=[];
  return o;
}
function capture(){
  const x=clone(window.data); if(!x)return;
  if(!undoStack.length || sig(undoStack.at(-1))!==sig(x)){
    undoStack.push(x); if(undoStack.length>MAX)undoStack.shift(); redoStack=[];
  }
}
function refresh(){
  try{normalizeAllData?.()}catch(_){}
  try{render?.()}catch(_){}
  try{renderFront?.()}catch(_){}
}
function restore(x){
  const o=validData(x); if(!o)return false;
  window.data=o; refresh();
  try{markDirty?.()}catch(_){}
  return true;
}
window.navV17Undo=function(){
  if(undoStack.length<2)return false;
  redoStack.push(undoStack.pop());
  return restore(undoStack.at(-1));
};
window.navV17Redo=function(){
  if(!redoStack.length)return false;
  const x=redoStack.pop(); undoStack.push(clone(x)); return restore(x);
};
window.navV17Capture=capture;
window.navV17Health=function(){
  let bytes=0,writable=false;
  try{
    bytes=new Blob([JSON.stringify(window.data||{})]).size;
    localStorage.setItem("__nav_v17_probe__","1");
    localStorage.removeItem("__nav_v17_probe__"); writable=true;
  }catch(_){}
  return {version:V,records:window.data?.lines?.length||0,
    categories:new Set((window.data?.lines||[]).map(x=>x.category)).size,
    storage:{writable,approxBytes:bytes},online:navigator.onLine,
    dirty:!!window.dirty,undo:undoStack.length,redo:redoStack.length,
    timestamp:new Date().toISOString()};
};
window.navV17Deduplicate=function(){
  const d=validData(window.data); if(!d)return 0;
  const seen=new Set(), out=[];
  d.lines.forEach(x=>{
    const k=(x.url||x.name).trim().toLowerCase();
    if(k&&!seen.has(k)){seen.add(k);out.push(x)}
  });
  const removed=d.lines.length-out.length;
  if(removed){capture(); d.lines=out; window.data=d; refresh(); markDirty?.();}
  return removed;
};
window.navV17Export=function(){
  const blob=new Blob([JSON.stringify(validData(window.data)||window.data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`nav-v17-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
window.navV17ScheduleLocalBackup=function(){
  clearTimeout(autosaveTimer);
  autosaveTimer=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(window.data||{}));}catch(_){}
  },700);
};
function status(){
  try{
    const h=navV17Health();
    const el=document.getElementById("v17Status");
    if(el)el.textContent=`v17.0 · ${h.records} 条 · ${h.categories} 分类 · ${h.online?"在线":"离线"}`;
  }catch(_){}
}
function addCommand(){
  if(!Array.isArray(window.COMMANDS))return;
  const names=new Set(COMMANDS.map(x=>x.name));
  const add=(name,icon,keys,run)=>{if(!names.has(name))COMMANDS.push({name,icon,keys,run})};
  add("v17 系统健康检查","fa-heart-pulse",["v17","健康"],()=>{const h=navV17Health();toast(`v17.0 · ${h.records} 条 · 撤销 ${h.undo} · 重做 ${h.redo}`)});
  add("清理重复网址","fa-filter-circle-xmark",["去重","重复"],()=>{const n=navV17Deduplicate();toast(n?`已清理 ${n} 条重复数据`:"没有发现重复数据")});
  add("v17 本地备份","fa-floppy-disk",["本地","备份"],()=>{navV17ScheduleLocalBackup();navV17Export();});
}
window.addEventListener("load",()=>{
  setTimeout(()=>{
    try{capture();addCommand();status()}catch(_){}
  },450);
});
document.addEventListener("keydown",e=>{
  const tag=(e.target?.tagName||"").toLowerCase();
  if(["input","textarea","select"].includes(tag)||e.target?.isContentEditable)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){
    e.preventDefault(); e.shiftKey?navV17Redo():navV17Undo(); status(); return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){
    e.preventDefault();navV17Redo();status();return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="b"){
    e.preventDefault();navV17Export();return;
  }
});
window.addEventListener("online",status);
window.addEventListener("offline",status);
window.addEventListener("beforeunload",()=>{try{localStorage.setItem(KEY,JSON.stringify(window.data||{}))}catch(_){}});
window.setInterval(()=>{try{if(window.dirty)navV17ScheduleLocalBackup();status()}catch(_){}},5000);
try{localStorage.setItem("nav_schema_version",V)}catch(_){}
})();
</script>

<script>
/* ===== v19.0 Precision Enterprise layer ===== */
(function(){
'use strict';
const V='18.0', KEY='nav_v19_snapshot', META='nav_v19_meta';
let timer=0, lastHash='';
function clone(x){try{return JSON.parse(JSON.stringify(x))}catch(_){return null}}
function hash(x){try{return JSON.stringify(x)}catch(_){return ''}}
function saveSnapshot(reason){
  try{const d=clone(window.data||{});if(!d)return false;const raw=JSON.stringify(d);localStorage.setItem(KEY,raw);localStorage.setItem(META,JSON.stringify({version:V,time:Date.now(),reason,size:raw.length}));lastHash=raw;return true}catch(_){return false}
}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>saveSnapshot('auto'),700)}
function health(){
  const d=window.data||{}, lines=Array.isArray(d.lines)?d.lines:[];
  const urls=lines.map(x=>String(x.url||'').trim().toLowerCase().replace(/\/$/,'')).filter(Boolean);
  let bytes=0,writable=false;try{bytes=new Blob([JSON.stringify(d)]).size;localStorage.setItem('__v19_probe','1');localStorage.removeItem('__v19_probe');writable=true}catch(_){}
  return {records:lines.length,categories:new Set(lines.map(x=>x.category).filter(Boolean)).size,duplicates:urls.length-new Set(urls).size,bytes,writable,online:navigator.onLine,dirty:!!window.dirty,recovery:!!localStorage.getItem(KEY)};
}
window.navV19Health=()=>({version:V,...health(),timestamp:new Date().toISOString()});
window.navV19Deduplicate=function(){
  const lines=Array.isArray(window.data?.lines)?window.data.lines:[],seen=new Set(),next=[];let removed=0;
  lines.forEach(x=>{const u=String(x.url||'').trim().toLowerCase().replace(/\/$/,'');if(u&&seen.has(u)){removed++;return}if(u)seen.add(u);next.push(x)});
  if(removed){try{if(typeof makeV8Backup==='function')makeV8Backup('v19-before-deduplicate')}catch(_){}window.data.lines=next;if(typeof markDirty==='function')markDirty();if(typeof render==='function')render();if(typeof renderFront==='function')renderFront();schedule()}
  return removed;
};
window.navV19Recover=function(){
  try{const raw=localStorage.getItem(KEY);if(!raw)return false;const d=JSON.parse(raw);if(!d||!Array.isArray(d.lines))return false;try{if(typeof makeV8Backup==='function')makeV8Backup('v19-before-recovery')}catch(_){}window.data=d;if(typeof normalizeAllData==='function')normalizeAllData();if(typeof render==='function')render();if(typeof renderFront==='function')renderFront();if(typeof markDirty==='function')markDirty();return true}catch(_){return false}
};
function status(){
  const el=document.getElementById('v17Status');if(!el)return;const h=health();el.classList.remove('online','offline','dirty');el.classList.add(!h.online?'offline':h.dirty?'dirty':'online');el.textContent=!h.online?'离线模式 · 本地数据可用':h.dirty?'有未同步修改 · 已自动保护':`v${V} · ${h.records} 个网站 · ${h.categories} 个分类 · 数据已保护`;
}
function commands(){
  if(!Array.isArray(window.COMMANDS))return;
  const add=(name,icon,keys,run)=>{if(!COMMANDS.some(x=>x.name===name))COMMANDS.push({name,icon,keys,run})};
  add('v19 系统健康检查','fa-heart-pulse',['v19','健康'],()=>{const h=health();toast(`v19 · ${h.records} 条 · 重复 ${h.duplicates} · ${h.online?'在线':'离线'}`)});
  add('清理重复网址','fa-filter-circle-xmark',['去重','重复'],()=>{const n=navV19Deduplicate();toast(n?`已清理 ${n} 条重复数据`:'没有发现重复数据')});
  add('恢复最近本地快照','fa-clock-rotate-left',['恢复','快照'],()=>{toast(navV19Recover()?'已恢复最近本地快照':'没有可恢复的本地快照')});
}
window.addEventListener('load',()=>setTimeout(()=>{saveSnapshot('startup');commands();status()},650));
window.addEventListener('online',status);window.addEventListener('offline',status);window.addEventListener('beforeunload',()=>saveSnapshot('unload'));
window.setInterval(()=>{try{if(hash(window.data)!==lastHash)schedule();status()}catch(_){}} ,5000);
try{localStorage.setItem('nav_schema_version',V)}catch(_){}
})();
</script>

<script>
/* ===== v19.0 Precision Enterprise Upgrade Layer ===== */
(function(){
  'use strict';
  const V19_KEY='nav_v19_settings';
  const SNAP_KEY='nav_v19_snapshots';
  const MAX_SNAP=20;

  function safeParse(v, fallback){
    try { return JSON.parse(v); } catch(e){ return fallback; }
  }
  function snapshot(){
    try{
      const raw=localStorage.getItem('nav_v18_backup') ||
                localStorage.getItem('nav_v17_backup') ||
                localStorage.getItem('nav_backup');
      if(!raw) return;
      const list=safeParse(localStorage.getItem(SNAP_KEY),[]);
      list.unshift({ts:Date.now(), data:raw});
      localStorage.setItem(SNAP_KEY,JSON.stringify(list.slice(0,MAX_SNAP)));
    }catch(e){}
  }
  function restoreLatest(){
    const list=safeParse(localStorage.getItem(SNAP_KEY),[]);
    if(!list.length) return false;
    try{
      localStorage.setItem('nav_v18_backup',list[0].data);
      location.reload();
      return true;
    }catch(e){ return false; }
  }
  function health(){
    const ls=[];
    let bytes=0;
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i)||'';
        const v=localStorage.getItem(k)||'';
        bytes += (k.length+v.length)*2;
        ls.push(k);
      }
    }catch(e){}
    return {
      version:'v19.0',
      localStorageKeys:ls.length,
      approxStorageBytes:bytes,
      snapshots:safeParse(localStorage.getItem(SNAP_KEY),[]).length,
      online:navigator.onLine
    };
  }

  // Expose a small, non-invasive diagnostic API.
  window.NavV19={
    version:'v19.0',
    snapshot,
    restoreLatest,
    health
  };

  // Periodic safety snapshot; avoids touching app state.
  snapshot();
  setInterval(snapshot, 10*60*1000);

  // Network status badge, created only if the page has a body.
  function badge(){
    if(!document.body) return;
    let el=document.getElementById('nav-v19-status');
    if(!el){
      el=document.createElement('div');
      el.id='nav-v19-status';
      el.setAttribute('aria-live','polite');
      el.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;padding:6px 10px;border-radius:999px;font:12px/1.2 system-ui,sans-serif;background:rgba(0,0,0,.72);color:#fff;backdrop-filter:blur(8px);opacity:.72;cursor:pointer';
      el.title='v19 状态；点击查看诊断';
      document.body.appendChild(el);
      el.addEventListener('click',()=>{
        const h=NavV19.health();
        alert('Nav v19.0\\n本地存储键：'+h.localStorageKeys+
              '\\n快照：'+h.snapshots+
              '\\n约占空间：'+h.approxStorageBytes+' bytes'+
              '\\n网络：'+(h.online?'在线':'离线'));
      });
    }
    el.textContent=navigator.onLine?'v19 · 在线':'v19 · 离线';
  }
  addEventListener('online',badge);
  addEventListener('offline',badge);
  addEventListener('load',badge);

  // Backup before leaving the page.
  addEventListener('beforeunload',snapshot);
})();
</script>
